# Builds the Obsidian plugin and attaches the three release assets Obsidian
# requires (main.js, manifest.json, styles.css) to the tagged GitHub release.
#
# Release flow:
#   1. Bump "version" (and "minAppVersion" if it changed) in the ROOT manifest.json
#      — it is the single source of truth — then run:
#          node scripts/check-versions.mjs --fix
#      which mirrors it into the plugin manifest, both package.json files, and
#      versions.json.
#   2. git tag <version> (tag must EXACTLY match manifest "version", no "v" prefix)
#   3. git push origin <version>
name: Release Obsidian plugin

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Guards the 0.4.0 failure mode: the plugin manifest was left on 0.3.0
      # while the root manifest said 0.4.0. Checks every version site AND the tag.
      - name: Verify versions agree (root + plugin manifest, package.json, versions.json, tag)
        run: node scripts/check-versions.mjs --tag="${GITHUB_REF_NAME}"

      # esbuild does no type checking, so without this the plugin package ships
      # unchecked. Runs core + plugin through tsc via project references.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build core + plugin
        run: npm run build

      # The embedded heartbeat source is generated from scripts/heartbeat.js and
      # committed; anything modified OR untracked here after the build means the
      # generator output drifted from what was committed.
      - name: Verify generated sources are current
        run: |
          DIRTY=$(git status --porcelain -- packages/obsidian-plugin/src/generated)
          if [ -n "$DIRTY" ]; then
            echo "Generated sources are stale or uncommitted:" >&2
            echo "$DIRTY" >&2
            echo "Run 'npm run gen:heartbeat' and commit the result." >&2
            exit 1
          fi

      - name: Create release with plugin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            packages/obsidian-plugin/main.js \
            packages/obsidian-plugin/manifest.json \
            packages/obsidian-plugin/styles.css
